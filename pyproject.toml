[project]
name = "support-agent"
version = "0.1.0"
description = "企业知识库智能客服 Agent（Agentic RAG）：LangGraph + Qdrant + DeepSeek + FastAPI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "langgraph>=1.2",
    "langchain>=1.3",
    "langchain-core>=1.4",
    "langchain-openai>=1.1",
    "langgraph-checkpoint-sqlite>=3.1",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.3",
    "qdrant-client>=1.19",
    "sentence-transformers>=6.0",
    "ragas>=0.4",
    "rank-bm25>=0.2",
    "langfuse>=4.12",
    "langsmith>=0.11",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-dotenv>=1.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
